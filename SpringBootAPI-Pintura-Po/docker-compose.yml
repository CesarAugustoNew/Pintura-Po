version: "3.8"

# Uso local para desenvolvimento: sobe a API + um Postgres.
# Não é usado pelo Render (lá o Postgres é um serviço gerenciado à parte).
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: pintura_po
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pintura_po_data:/var/lib/postgresql/data

  api:
    build: .
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/pintura_po
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      APP_JWT_SECRET: dev-secret-nao-use-em-producao
    ports:
      - "8080:8080"

volumes:
  pintura_po_data:
