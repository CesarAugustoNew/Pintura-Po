spring.application.name=pintura-po

# --- Banco de dados (PostgreSQL) ---
# No Render, essas variáveis vêm do serviço de banco (Internal Database URL).
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/pintura_po}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
# "update" cria/ajusta as tabelas automaticamente a partir das entidades.
# Simples e suficiente para o MVP; para produção madura, prefira Flyway/Liquibase.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# --- Servidor ---
server.port=${PORT:8080}

# --- CORS ---
# Domínios liberados a chamar a API, separados por vírgula.
# Ex.: https://pintura-po.vercel.app,http://localhost:5173
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# --- JWT ---
# Em produção, SEMPRE defina APP_JWT_SECRET como variável de ambiente
# (uma string longa e aleatória, ex.: `openssl rand -base64 48`).
app.jwt.secret=${APP_JWT_SECRET:troque-este-segredo-em-producao-por-uma-string-longa-e-aleatoria}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:28800000}

# --- Usuários iniciais (criados automaticamente se ainda não existirem) ---
app.init.admin.username=${ADMIN_USERNAME:admin}
app.init.admin.password=${ADMIN_PASSWORD:admin123}
app.init.admin.nome=${ADMIN_NOME:Administrador}

app.init.operador.username=${OPERADOR_USERNAME:operador}
app.init.operador.password=${OPERADOR_PASSWORD:operador123}
app.init.operador.nome=${OPERADOR_NOME:Operador}

# --- Actuator (health check usado pelo Render) ---
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
