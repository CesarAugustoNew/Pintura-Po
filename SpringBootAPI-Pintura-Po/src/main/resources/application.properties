spring.application.name=pintura-po

# --- Banco de dados (PostgreSQL) ---
# Banco no Supabase (compartilhado com outros projetos, cada um no seu schema).
# Usar o Session pooler (IPv4), não a conexão direta (só IPv6, o Render não alcança):
#   DATABASE_URL=jdbc:postgresql://aws-0-<regiao>.pooler.supabase.com:5432/postgres?currentSchema=pintura&sslmode=require
#   DATABASE_USERNAME=postgres.<project-ref>
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/pintura_po?currentSchema=pintura}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# O pool do Supabase free é dividido entre os projetos: manter poucas conexões.
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=2

# --- JPA / Hibernate ---
# "update" cria/ajusta as tabelas automaticamente a partir das entidades.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Schema próprio deste projeto dentro do banco compartilhado.
spring.jpa.properties.hibernate.default_schema=pintura
# Sem isso o Hibernate não cria o schema na primeira subida e falha com "schema does not exist".
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# --- Servidor ---
server.port=${PORT:8080}

# --- CORS ---
# Domínios liberados a chamar a API, separados por vírgula.
# Ex.: https://pintura-po.vercel.app,http://localhost:5173
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# --- JWT ---
# Em produção, SEMPRE defina APP_JWT_SECRET como variável de ambiente
# (uma string longa e aleatória, ex.: `openssl rand -base64 48`).
app.jwt.secret=${APP_JWT_SECRET:troque-este-segredo-em-producao-por-uma-string-longa-e-aleatoria}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:28800000}

# --- Usuários iniciais (criados para qualquer um acessar e testar) ---
app.init.admin.username=${ADMIN_USERNAME:admin}
app.init.admin.password=${ADMIN_PASSWORD:admin123}
app.init.admin.nome=${ADMIN_NOME:Administrador}

app.init.operador.username=${OPERADOR_USERNAME:operador}
app.init.operador.password=${OPERADOR_PASSWORD:operador123}
app.init.operador.nome=${OPERADOR_NOME:Operador}

# --- Actuator (health check usado pelo Render) ---
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
